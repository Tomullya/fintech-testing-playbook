# Website (en). Sources are generated by scripts/build_site.py — do not edit build/.
site_name: Fintech Testing Playbook
site_description: How fintech business processes work and how to test them
site_url: https://tomullya.github.io/fintech-testing-playbook/
repo_url: https://github.com/Tomullya/fintech-testing-playbook
repo_name: Tomullya/fintech-testing-playbook
docs_dir: build/site_src/en
site_dir: build/site
edit_uri: ""
theme:
  name: material
  language: en
  features:
    - navigation.instant
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: amber
      toggle: {icon: material/weather-night, name: Dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: amber
      toggle: {icon: material/weather-sunny, name: Light mode}
  icon:
    logo: material/credit-card-check-outline
extra:
  alternate:
    - {name: English, link: https://tomullya.github.io/fintech-testing-playbook/, lang: en}
    - {name: Русский, link: https://tomullya.github.io/fintech-testing-playbook/ru/, lang: ru}
  social:
    - {icon: fontawesome/brands/github, link: https://github.com/Tomullya}
markdown_extensions:
  - tables
  - toc: {permalink: true}
  - admonition
  - attr_list
  - pymdownx.tasklist: {custom_checkbox: true}
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
validation:
  links: {not_found: warn, anchors: warn, absolute_links: info, unrecognized_links: warn}
nav:
  - Home: index.md
  - 01-card-payment.md
  - 02-accounting.md
  - 03-money.md
  - 04-card-lifecycle.md
  - 05-transfers.md
  - 06-limits-fraud-aml.md
  - 07-onboarding-kyc.md
  - 08-regulation.md
  - 09-test-data.md
  - 10-interview-questions.md
  - Glossary: glossary.md
  - ru-terminology-check.md
