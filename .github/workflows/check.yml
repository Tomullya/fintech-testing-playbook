name: Playbook check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Checker and site generator tests
        run: python -m unittest discover -s tests -v
      - name: Structure, template and links
        run: python scripts/check_playbook.py

  site:
    needs: check
    runs-on: ubuntu-latest
    env:
      NO_MKDOCS_2_WARNING: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install MkDocs Material
        run: pip install -r requirements-site.txt
      - name: Build the website (EN, then RU into /ru/; strict = broken links fail)
        run: |
          python scripts/build_site.py build/site_src
          mkdocs build --strict -f mkdocs.yml
          mkdocs build --strict -f mkdocs.ru.yml
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        with:
          path: build/site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: site
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
