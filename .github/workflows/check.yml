name: Playbook check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install site build dependencies (pinned)
        run: pip install -r requirements-site.txt
      - name: Checker and site builder tests
        run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Site routing tests
        run: node --test "web/tests/*.test.mjs"
      - name: Structure, template and links
        run: python scripts/check_playbook.py

  site:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install site build dependencies (pinned)
        run: pip install -r requirements-site.txt
      - name: Build the website
        run: python scripts/build_site.py build/site
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        with:
          path: build/site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: site
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
