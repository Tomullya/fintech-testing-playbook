name: Playbook check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Checker tests
        run: python -m unittest discover -s tests -v
      - name: Structure, template and links
        run: python scripts/check_playbook.py
