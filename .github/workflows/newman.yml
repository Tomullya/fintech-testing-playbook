name: 🧪 Newman API Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  newman:
    name: Run Postman Collection
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📦 Install Newman & HTML reporter
        run: npm install -g newman newman-reporter-htmlextra

      - name: 🔐 Create environment from GitHub Secrets
        run: |
          mkdir -p postman/environments
          cat > postman/environments/ci.json << EOF
          {
            "id": "ci-environment",
            "name": "CI Environment",
            "values": [
              {"key": "base_url",   "value": "${{ secrets.API_BASE_URL }}", "enabled": true},
              {"key": "api_token",  "value": "${{ secrets.API_TOKEN }}",    "enabled": true},
              {"key": "account_id", "value": "${{ secrets.ACCOUNT_ID }}",   "enabled": true}
            ]
          }
          EOF

      - name: 🚀 Run Newman tests
        run: |
          if ls postman/collections/*.json 1> /dev/null 2>&1; then
            newman run postman/collections/*.json \
              --environment postman/environments/ci.json \
              --reporters cli,htmlextra \
              --reporter-htmlextra-export reports/report.html \
              --suppress-exit-code
          else
            echo "⚠️  No collections found yet — skipping run"
          fi

      - name: 📊 Upload HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: newman-report
          path: reports/
          retention-days: 30